name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { django: "4.2", python: "3.10" }
          - { django: "5.1", python: "3.12" }
          - { django: "5.2", python: "3.13" }
          - { django: "6.0", python: "3.13" }
          - { django: "6.1", python: "3.14" }
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Until hibira 0.1 is on PyPI: install the SDK from GitHub first.
      - run: pip install "hibira @ git+https://github.com/hibira-io/python@claude/project-thread-41jdmz"
      - run: pip install "Django~=${{ matrix.django }}.0" -e ".[test]"
      - run: pytest
