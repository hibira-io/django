name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { django: "4.2", python: "3.10" }
          - { django: "5.1", python: "3.12" }
          - { django: "5.2", python: "3.13" }
          - { django: "6.0", python: "3.13" }
          - { django: "6.1", python: "3.14" }
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django~=${{ matrix.django }}.0" -e ".[test]"
      - run: pytest
